name: Cyphal multi-device integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  multi-device-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out device-template
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Initialize gateway integration runner
        run: |
          git clone --no-checkout https://github.com/opensimgear/device-gateway.git .e2e/deps/device-gateway
          git -C .e2e/deps/device-gateway checkout --detach 0b13cdb7cc9642b18f13bd6625d8d2288e0493aa
          git -C .e2e/deps/device-gateway submodule update --init --recursive
      - name: Test independent gateway and JSON devices with sanitizers
        run: |
          python3 .e2e/deps/device-gateway/tests/e2e/run.py --sanitize \
            --source "device-template=$GITHUB_WORKSPACE"
