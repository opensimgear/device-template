name: STM32G0B1 firmware build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  input-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure native behavior tests
        run: cmake -S firmware/tests -B .build/tests -DCMAKE_BUILD_TYPE=Release
      - name: Build and test
        run: |
          cmake --build .build/tests --parallel
          ctest --test-dir .build/tests --output-on-failure
      - name: Address and undefined behavior sanitizer checks
        run: |
          cmake -S firmware/tests -B .build/sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build .build/sanitized --parallel
          ctest --test-dir .build/sanitized --output-on-failure
      - name: Native JSON device simulation tests
        run: python3 simulation/test.py --sanitize
      - name: Action routing coverage above 70 percent
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang-18 llvm-18
          python3 firmware/tests/coverage.py --clang clang-18 --llvm-cov llvm-cov-18 --llvm-profdata llvm-profdata-18
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: [example, shifter, expanded, master_caution, radio_panel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure compile-only smoke build
        # Unallocated placeholders; never flash/distribute a device with these IDs.
        working-directory: firmware
        run: cmake --preset starter -DOSG_DEVICE_PROFILE=${{ matrix.profile }} -DOSG_USB_VID=0xFFFF -DOSG_USB_PID=0xFFFF
      - name: Build real board target
        working-directory: firmware
        run: cmake --build --preset starter --parallel
